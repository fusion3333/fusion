name: CI

on:
  push:
    branches: ["메인", "feature/**"]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run doctor
      - run: node --check scripts/import-gyeonggi-north-crime.mjs
      - run: node --check scripts/normalize-crime-data.mjs

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
